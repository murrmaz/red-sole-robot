{% extends "actions/base.html" %}
{% load static %}
{% block title %}Dashboard — Red Sole Robot{% endblock %}
{% block content %}
    <h1 class="title">Dashboard</h1>

    <div class="buttons has-addons">
        <button class="button is-small is-link" data-granularity="hour">Hourly</button>
        <button class="button is-small" data-granularity="day">Daily</button>
    </div>

    <h2 class="subtitle">Reddit Posts</h2>
    <canvas id="post-chart" height="90"></canvas>

    <h2 class="subtitle">Reddit Comments</h2>
    <canvas id="comment-chart" height="90"></canvas>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/chart.umd.min.js' %}"></script>
    <script src="{% static 'js/chartjs-adapter-date-fns.bundle.min.js' %}"></script>
    <script>
        const METRIC_COLORS = {
            ingested: '#2a78d6',
            evaluated: '#eb6834',
            flagged: '#1baf7a',
        };

        const charts = {
            post: { ctx: document.getElementById('post-chart'), instance: null },
            comment: { ctx: document.getElementById('comment-chart'), instance: null },
        };

        function bucketItemsUrl(itemType, metric, granularity, bucketStart) {
            const params = new URLSearchParams({
                item_type: itemType, metric, granularity, bucket_start: bucketStart,
            });
            return `{% url 'bucket_items' %}?${params.toString()}`;
        }

        async function loadMetrics(itemType, granularity) {
            const resp = await fetch(`{% url 'metrics_data' %}?item_type=${itemType}&granularity=${granularity}`);
            const data = await resp.json();

            const datasets = data.datasets.map(ds => ({
                label: ds.label,
                metric: ds.metric,
                data: ds.data,
                backgroundColor: METRIC_COLORS[ds.label.toLowerCase()],
                borderWidth: 0,
            }));

            const entry = charts[itemType];
            if (entry.instance) {
                entry.instance.destroy();
            }
            entry.instance = new Chart(entry.ctx, {
                type: 'bar',
                data: { labels: data.labels, datasets },
                options: {
                    scales: {
                        x: {
                            type: 'time',
                            time: { unit: granularity === 'hour' ? 'hour' : 'day' },
                            stacked: true,
                            grid: { color: '#e1e0d9' },
                        },
                        y: { stacked: true, beginAtZero: true, grid: { color: '#e1e0d9' } },
                    },
                    onClick(event, elements, chart) {
                        const hit = chart.getElementsAtEventForMode(event, 'nearest', { intersect: true }, true);
                        if (!hit.length) return;
                        const { datasetIndex, index } = hit[0];
                        const metric = chart.data.datasets[datasetIndex].metric.split('.')[0];
                        const bucketStart = chart.data.labels[index];
                        window.location.href = bucketItemsUrl(itemType, metric, granularity, bucketStart);
                    },
                },
            });
        }

        const buttons = document.querySelectorAll('[data-granularity]');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('is-link'));
                btn.classList.add('is-link');
                loadMetrics('post', btn.dataset.granularity);
                loadMetrics('comment', btn.dataset.granularity);
            });
        });

        loadMetrics('post', 'hour');
        loadMetrics('comment', 'hour');
    </script>
{% endblock %}
