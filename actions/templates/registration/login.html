{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in — Red Sole Robot</title>
    <link rel="stylesheet" href="{% static 'css/bulma.min.css' %}">
</head>
<body>
    <section class="section">
        <div class="container" style="max-width: 360px;">
            <h1 class="title">Log in</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="control">
                    <button type="submit" class="button is-link">Log in</button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
